name: Terraform CI/CD

on:
  push:
    branches:
      - main   # change this if your branch is different

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform   # change if your terraform folder name is different

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::176319219702:role/adminacc
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Convert Plan to JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Install Conftest
        run: |
          VERSION=0.45.0
          wget https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz
          tar xzf conftest_${VERSION}_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin

      - name: Policy Check
        run: conftest test tfplan.json --policy ../policy

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Wait 5 Minutes
        run: sleep 300

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
